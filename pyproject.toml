[project]
name = "yds-graph"
version = "0.2.0"
description = "LangGraph model of YourDataScouting: gates, a facts sheet, human review, and cite-or-stop retrieval."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real model; skipped unless ANTHROPIC_API_KEY is set or\n    YDS_MODEL_BASE_URL points at a reachable OpenAI compatible server",
]
addopts = "-q -m 'not live'"
