[project]
name = "yds-graph"
version = "0.1.0"
description = "A LangGraph report pipeline and staff assistant with gates, a facts sheet, and a human in the loop."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real model; skipped unless ANTHROPIC_API_KEY is set or\n    YDS_MODEL_BASE_URL points at a reachable OpenAI compatible server",
]
addopts = "-q -m 'not live'"
