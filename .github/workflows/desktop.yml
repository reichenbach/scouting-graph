name: YDS Review

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Build
        run: python scripts/build_desktop.py
      - name: Smoke test the Linux build
        if: runner.os == 'Linux'
        run: ./dist/YDS-Review/YDS-Review --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: YDS-Review-${{ runner.os }}
          path: dist-pack/*.zip
          if-no-files-found: error
      - name: Attach the build to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-pack/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
